# The web installer (web/index.html) on GitHub Pages, built from a
# release's flash image by tools/p4/web_site.py: when a release is
# published, or by hand for a given tag.
name: Web installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty: the latest)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the release's flash image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern 'ts2068-p4-v*.zip' --dir dl
      - name: Build the site
        run: python3 tools/p4/web_site.py dl/ts2068-p4-v*.zip --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
